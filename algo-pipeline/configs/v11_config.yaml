# V11 Config: Shared Backbone + Wider Bottleneck
# Built on V7 (best so far: AUC 0.6613 ± 0.0374, +0.0222 over baseline)
# Key changes from V10:
#   1. ResNet-18 (back from EfficientNet-B0) - proven better for our data size
#   2. Shared backbone across all 4 image types (1 backbone vs 4)
#   3. Wider CNN bottleneck (128 vs 32) - stops crushing CNN features
#   4. Partial freeze (like V7) - prevents overfitting
#   5. Gradient accumulation for effective batch_size=64
#   6. Removed RandomErasing augmentation

# Data
data_csv: '../data/multimodal_dataset.csv'
features_txt: '../data/multimodal_dataset_features.txt'
image_dir: '../data/cropped_output_v2'
output_dir: 'results'
image_size: 224

# Architecture
backbone: 'resnet18'
freeze_mode: 'partial'
shared_backbone: true         # NEW: single shared backbone
adapter_mode: 'per_branch'    # Per-branch adapters on shared backbone
use_attention: true
use_cross_modal_fusion: true
bottleneck_dim: 128           # WIDENED from 32
n_select_features: 50

# Training
training_mode: 'hybrid_finetuned'
batch_size: 32
num_epochs: 20
finetune_epochs: 30
learning_rate: 0.0001
backbone_lr: 0.000001        # Nearly frozen backbone
weight_decay: 0.01            # Stronger regularization
dropout: 0.4
patience: 10
finetune_patience: 7
warmup_epochs: 2
gradient_accumulation_steps: 2  # Effective batch_size=64
scheduler: 'cosine'

# Augmentation
use_augmentation: true
use_mixup: true
mixup_alpha: 0.3

# Imbalance
imbalance_loss_type: 'focal'
focal_gamma: 2.0
use_weighted_sampler: true

# XGBoost
xgb_n_estimators: 200
xgb_max_depth: 4
xgb_learning_rate: 0.02
xgb_colsample_bytree: 0.8
xgb_subsample: 0.8

# CV
n_cv_folds: 5
random_state: 42

# Ensemble
use_ensemble: true
ensemble_method: 'average'

# Wandb
wandb_enabled: true
wandb_project: 'kerv2'
wandb_entity: 'hcohen'
wandb_run_name: 'v11_shared_wider'
