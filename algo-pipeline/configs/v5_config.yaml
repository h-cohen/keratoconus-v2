# V5 Config: ResNet18 Optimized + More Features
# Data
data_csv: '../data/multimodal_dataset.csv'
features_txt: '../data/multimodal_dataset_features.txt'
image_dir: '../data/cropped_output_v2'
output_dir: 'results'
image_size: 224

# Architecture
backbone: 'resnet18'
freeze_mode: 'partial'
adapter_mode: 'per_branch'
use_attention: true
use_cross_modal_fusion: true
n_select_features: 100  # Increased from 50

# Training
training_mode: 'hybrid_finetuned'
batch_size: 32
num_epochs: 20
finetune_epochs: 15
learning_rate: 0.00005
backbone_lr: 0.000005  # Reduced from 1e-5 to 5e-6 for stability
weight_decay: 0.005
dropout: 0.5
patience: 10
finetune_patience: 5
warmup_epochs: 0
use_mixup: false
mixup_alpha: 0.2
use_augmentation: true

# Imbalance
imbalance_loss_type: 'focal'
focal_gamma: 2.0
use_weighted_sampler: true

# XGBoost
xgb_n_estimators: 500   # Increased from 200
xgb_max_depth: 4
xgb_learning_rate: 0.01 # Reduced from 0.02
xgb_colsample_bytree: 0.8
xgb_subsample: 0.8

# CV
n_cv_folds: 5
random_state: 42

# Wandb
wandb_enabled: true
wandb_project: 'kerv2'
wandb_entity: 'hcohen'
wandb_run_name: 'v5_resnet18_opt'
